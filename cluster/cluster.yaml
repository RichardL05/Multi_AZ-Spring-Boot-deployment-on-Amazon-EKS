apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: spring-eks-cluster
  region: ap-southeast-2
  version: "1.36"
vpc:
  id: "vpc-0d644606022fe0e57"
  subnets:
    private:
      ap-southeast-2a:
        id: "subnet-03492f5e329ddccaf"
      ap-southeast-2b:
        id: "subnet-035775071a04a16f1"
    public:
      ap-southeast-2a:
        id: "subnet-00cc5da9cc8b82a49"
      ap-southeast-2b:
        id: "subnet-08c1c9a53f7b9f09f"
managedNodeGroups:
  - name: ng-1
    labels: { role: worker }
    instanceType: m7i-flex.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 3
    privateNetworking: true
    ssh:
      allow: true
      publicKeyName: eks-project-key
    iam:
      withAddonPolicies:
        imageBuilder: true
        awsLoadBalancerController: true
        autoScaler: true

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      attachPolicyARNs:
        - "arn:aws:iam::722720288676:policy/AWSLoadBalancerControllerIAMPolicy"
